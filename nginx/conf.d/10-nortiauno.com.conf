# nortiauno.com — StrawBoss (admin Next.js + API backend în Docker)
# Terminate TLS; ACME pe /.well-known/
# Vezi ../README.md pentru certbot / ssl:init.

# HTTP: redirect HTTPS + ACME
server {
    listen 80;
    server_name nortiauno.com www.nortiauno.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nortiauno.com www.nortiauno.com;

    ssl_certificate     /etc/letsencrypt/live/nortiauno.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nortiauno.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # APK uploads (Tailscale ~100MB, release APKs ~155MB) go through /api/; default is 1MB.
    # Keep at/above the backend's 250MB per-request multipart limit.
    client_max_body_size 300M;

    location = /api/client-log {
        set $admin_upstream admin:3000;
        proxy_pass         http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream strawboss-backend-1:3001;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        set $admin_upstream admin:3000;
        proxy_pass         http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
