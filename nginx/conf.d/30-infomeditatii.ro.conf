# infomeditatii.ro — Eduvora (uvicorn pe host: systemd infomeditatii.service)
# TLS: Let's Encrypt în volumul Docker (certbot); reînnoire automată prin certbot container.

upstream infomeditatii_upstream {
    server host.docker.internal:8000;
    keepalive 8;
}

# HTTP — ACME + redirect către HTTPS
server {
    listen 80;
    server_name infomeditatii.ro www.infomeditatii.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name infomeditatii.ro www.infomeditatii.ro;

    ssl_certificate     /etc/letsencrypt/live/infomeditatii.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infomeditatii.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_INFOM:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://infomeditatii_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_read_timeout   60s;
        proxy_connect_timeout 10s;
        client_max_body_size 2m;
    }
}
