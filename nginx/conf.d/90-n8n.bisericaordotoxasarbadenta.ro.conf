server {
    listen 80;
    server_name n8n.bisericaordotoxasarbadenta.ro;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name n8n.bisericaordotoxasarbadenta.ro;

    ssl_certificate     /etc/letsencrypt/live/n8n.bisericaordotoxasarbadenta.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.bisericaordotoxasarbadenta.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_N8N:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $u n8n:5678;
        proxy_pass          http://$u;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
    }
}
