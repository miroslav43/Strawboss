# steitravel.serviceproof.ro — StayTravel (static files)
# ssl:init: cd /srv/apps/StayTravel && bash deploy.sh

server {
    listen 80;
    server_name steitravel.serviceproof.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name steitravel.serviceproof.ro;

    ssl_certificate     /etc/letsencrypt/live/steitravel.serviceproof.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steitravel.serviceproof.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript;

    root /srv/apps/StayTravel;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jsx|png|jpg|jpeg|gif|ico|svg|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
