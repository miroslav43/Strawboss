# video.tedde-auto.ro — edge proxy către laptop (Tailscale)

server {
    listen 80;
    server_name video.tedde-auto.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name video.tedde-auto.ro;

    ssl_certificate     /etc/letsencrypt/live/video.tedde-auto.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.tedde-auto.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSLVID:10m;
    ssl_session_timeout 10m;

    set $tedde_laptop 100.90.57.70;

    client_max_body_size 2g;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;

    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    proxy_buffering       off;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass http://$tedde_laptop:8000;
    }
    location /ws  { proxy_pass http://$tedde_laptop:8000; }
    location /socket.io/ { proxy_pass http://$tedde_laptop:8000; }
    location /static/    { proxy_pass http://$tedde_laptop:8000; }
    location /media/     { proxy_pass http://$tedde_laptop:8000; }
    location /uploads/   { proxy_pass http://$tedde_laptop:8000; }
    location /docs       { proxy_pass http://$tedde_laptop:8000; }
    location /openapi.json { proxy_pass http://$tedde_laptop:8000; }

    location / {
        proxy_pass http://$tedde_laptop:3000;
    }
}
