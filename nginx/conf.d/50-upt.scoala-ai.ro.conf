# upt.scoala-ai.ro (frontend Next.js) + api.scoala-ai.ro (backend Payload: API + admin)
# AntreprenoriatStudentesc — Docker. Pattern după 10-nortiauno.com.conf:
# Docker→Docker pe numele containerului, resolver 127.0.0.11 + `set $upstream`
# (nginx nu cade la reload dacă un container e jos).

# HTTP: ACME + redirect HTTPS
server {
    listen 80;
    server_name upt.scoala-ai.ro api.scoala-ai.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — upt.scoala-ai.ro: frontend (/) + API same-origin (/api/ → backend)
server {
    listen 443 ssl;
    server_name upt.scoala-ai.ro;

    ssl_certificate     /etc/letsencrypt/live/upt.scoala-ai.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upt.scoala-ai.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $be scoala-ai-backend:3001;
        proxy_pass         http://$be;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        set $fe scoala-ai-frontend:3000;
        proxy_pass         http://$fe;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# HTTPS — api.scoala-ai.ro: backend (Payload API + admin UI + its /_next assets)
server {
    listen 443 ssl;
    server_name api.scoala-ai.ro;

    ssl_certificate     /etc/letsencrypt/live/upt.scoala-ai.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upt.scoala-ai.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $be scoala-ai-backend:3001;
        proxy_pass         http://$be;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
