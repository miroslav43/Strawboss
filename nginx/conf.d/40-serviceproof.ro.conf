upstream serviceproof_api {
    server host.docker.internal:8001;
    keepalive 4;
}

# HTTP — ACME + redirect HTTPS
server {
    listen 80;
    server_name serviceproof.ro www.serviceproof.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name serviceproof.ro www.serviceproof.ro;

    ssl_certificate     /etc/letsencrypt/live/serviceproof.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serviceproof.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_SP:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root "/srv/apps/Service Proof";
    index "Service Proof.html";
    charset utf-8;

    location /api/ {
        proxy_pass         http://serviceproof_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ "=404";
    }
}
