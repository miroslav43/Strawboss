# buget.scoala-ai.ro — AI Personal Finance Dashboard (frontend + same-origin /api -> backend)
server {
    listen 80;
    server_name buget.scoala-ai.ro;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name buget.scoala-ai.ro;

    ssl_certificate     /etc/letsencrypt/live/buget.scoala-ai.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buget.scoala-ai.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Next.js behind the proxy can leak its internal :3000 port in redirect
    # Location headers; rewrite any such redirect back to the public origin.
    proxy_redirect ~^https?://[^/]+:3000(/.*)$ https://buget.scoala-ai.ro$1;

    location /api/ {
        set $be budget-backend:8000;
        proxy_pass         http://$be;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 300s;
    }

    location / {
        set $fe budget-frontend:3000;
        proxy_pass         http://$fe;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
    }
}
