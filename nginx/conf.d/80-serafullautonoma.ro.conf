# serafullautonoma.ro — Greenhouse app (React SPA + FastAPI backend, Docker)
#   /        -> serafullautonoma-frontend:80   (nginx static, SPA try_files)
#   /api/*   -> serafullautonoma-backend:8200  (FastAPI; strips /api; SSE-safe)
#   /alexa   -> 100.102.162.74:65433           (laptop ws_server.py, via Tailscale)
# set $u + resolver => a down upstream yields 502, never a reload crash.

# ---- HTTP: ACME + redirect ----
server {
    listen 80;
    server_name serafullautonoma.ro www.serafullautonoma.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    server_name serafullautonoma.ro www.serafullautonoma.ro;

    ssl_certificate     /etc/letsencrypt/live/serafullautonoma.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serafullautonoma.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API: strip /api, proxy to FastAPI. SSE-safe (/api/chat/stream). ----
    location /api/ {
        set $u serafullautonoma-backend:8200;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$u;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # ---- Voice WebSocket -> laptop (alexa/ws_server.py) over Tailscale ----
    location /alexa {
        proxy_pass         http://100.102.162.74:65433;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- SPA frontend ----
    location / {
        set $f serafullautonoma-frontend:80;
        proxy_pass         http://$f;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
