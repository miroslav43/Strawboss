name: Bug Scan

# Analiză completă de bug-uri (securitate web/mobile, logică, integritate date).
# Rulează la fiecare push, la fiecare pull request, și manual din UI.
on:
  push:
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Un push care face parte dintr-un PR și evenimentul pull_request cad în același grup
# (după branch-ul sursă), deci se anulează reciproc — nu rulează de două ori.
concurrency:
  group: bug-scan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  bug-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout (cu istoric)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude bug-hunt
        uses: anthropics/claude-code-action@v1
        with:
          # Token OAuth dintr-un abonament Claude (claude setup-token).
          # Alternativ: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repo: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}

            Fă o analiză completă de bug-uri pe schimbările relevante.

            1. Determină fișierele schimbate, în funcție de eveniment:
               - pull_request: `git diff --name-only origin/${{ github.base_ref }}...HEAD`
               - push: `git diff --name-only ${{ github.event.before }} ${{ github.sha }}`
                 (dacă `${{ github.event.before }}` e numai zerouri — branch nou —
                 compară cu `origin/main`)
               - workflow_dispatch: `git diff --name-only origin/main...HEAD`
                 (dacă e gol sau ești pe main, folosește `git diff --name-only HEAD~1 HEAD`)
               Dacă diff-ul e gol, nu posta nimic și oprește-te.
            2. Invocă skill-ul `strawboss-bug-hunt` pentru analiza multi-unghi completă —
               securitate web/backend, securitate mobilă, bug-uri de logică, integritate
               date, calitate cod. Skill-ul dispecerizează agenții de review specializați.
            3. Scrie raportul consolidat într-un fișier și publică-l:
               - pull_request: comentariu pe PR —
                 `gh pr comment ${{ github.event.pull_request.number }} --body-file <raport.md>`
               - push / workflow_dispatch: dacă există cel puțin un finding, creează un issue —
                 `gh issue create --label bug-scan --title "Bug scan: ${{ github.ref_name }} <short-sha>" --body-file <raport.md>`
                 Dacă nu sunt findings, nu crea issue — afișează doar "no findings".

            Nu modifica cod. Doar analizează și raportează.
          claude_args: |
            --allowedTools Read,Grep,Glob,Bash,Write,Task
            --max-turns 50
