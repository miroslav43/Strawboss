name: Bug Scan

# Analiză completă de bug-uri (securitate web/mobile, logică, integritate date).
# anthropics/claude-code-action NU suportă evenimentul `push` — de aceea folosim
# `pull_request` (declanșat de fiecare push pe branch-ul unui PR, prin `synchronize`)
# plus `workflow_dispatch` pentru rulare manuală din UI.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Push-uri rapide pe același branch de PR se anulează reciproc — o singură rulare.
concurrency:
  group: bug-scan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  bug-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout (cu istoric)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude bug-hunt
        uses: anthropics/claude-code-action@v1
        with:
          # Token OAuth dintr-un abonament Claude (claude setup-token).
          # Alternativ: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repo: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}

            Fă o analiză completă de bug-uri pe schimbările relevante.

            1. Determină fișierele schimbate, în funcție de eveniment:
               - pull_request: `git diff --name-only origin/${{ github.base_ref }}...HEAD`
               - workflow_dispatch: `git diff --name-only origin/main...HEAD`
                 (dacă e gol sau ești pe main, folosește `git diff --name-only HEAD~1 HEAD`)
               Dacă diff-ul e gol, nu posta nimic și oprește-te.
            2. Invocă skill-ul `strawboss-bug-hunt` pentru analiza multi-unghi completă —
               securitate web/backend, securitate mobilă, bug-uri de logică, integritate
               date, calitate cod. Skill-ul dispecerizează agenții de review specializați.
            3. Scrie raportul consolidat într-un fișier și publică-l:
               - pull_request: comentariu pe PR —
                 `gh pr comment ${{ github.event.pull_request.number }} --body-file <raport.md>`
               - workflow_dispatch: dacă există cel puțin un finding, creează un issue —
                 `gh issue create --label bug-scan --title "Bug scan: ${{ github.ref_name }} <short-sha>" --body-file <raport.md>`
                 Dacă nu sunt findings, nu crea issue — afișează doar "no findings".

            Nu modifica cod. Doar analizează și raportează.
          claude_args: |
            --model claude-opus-4-7
            --allowedTools Read,Grep,Glob,Bash,Write,Task
            --max-turns 50

      - name: Notificare WhatsApp — bug-scan
        env:
          GH_TOKEN:         ${{ github.token }}
          CALLMEBOT_PHONE:  ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PR_NUM:           ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CALLMEBOT_PHONE" ] || [ -z "$CALLMEBOT_APIKEY" ]; then exit 0; fi
          COMMENT=""
          if [ -n "$PR_NUM" ]; then
            COMMENT=$(gh pr view "$PR_NUM" --json comments \
              --jq '.comments | map(select(.author.login == "claude")) | last | .body' 2>/dev/null || echo "")
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          cat > /tmp/parse_bugscan.py << 'PYEOF'
          import os, re, sys
          comment = os.environ.get('COMMENT', '')
          branch  = os.environ.get('BRANCH', '')
          pr_num  = os.environ.get('PR_NUM', 'N/A')
          def get_sec(text, start, ends):
              s = text.find(start)
              if s < 0: return ''
              e = len(text)
              for em in ends:
                  p = text.find(em, s + 1)
                  if 0 < p < e: e = p
              return text[s:e]
          def findings(sec):
              out = []
              for part in re.split(r'\n(?=###)', sec)[1:]:
                  hm = re.match(r'###\s+(\[.*?\])\s+`([^`]+)`', part.strip())
                  if not hm: continue
                  cat = hm.group(1)
                  loc = hm.group(2).rsplit('/', 1)[-1]
                  bm  = re.search(r'\*\*Bug:\*\*\s*([^\n*]{1,55})', part)
                  desc = (' — ' + bm.group(1).strip()) if bm else ''
                  out.append(f'{cat} {loc}{desc}')
              return out
          def cnt(sec): return len(re.findall(r'\n###\s+', sec))
          ends = ['## \U0001f7e0','## \U0001f7e1','## \U0001f7e2','## ✅']
          C = findings(get_sec(comment, '## \U0001f534', ends))
          H = findings(get_sec(comment, '## \U0001f7e0', ends[1:]))
          M = cnt(get_sec(comment, '## \U0001f7e1', ends[2:]))
          L = cnt(get_sec(comment, '## \U0001f7e2', ['## ✅']))
          if not C and not H and M == 0 and L == 0:
              m = re.search(r'Findings:.*', comment)
              fb = m.group(0) if m else 'raport pe GitHub'
              print(f'\U0001f50d Bug Scan — StrawBoss\nPR #{pr_num} | {branch}\n\n{fb}\n\n⚡ Bug Fix pornit (Opus)')
              sys.exit(0)
          lines = [f'\U0001f50d Bug Scan — StrawBoss', f'PR #{pr_num} | {branch}', '']
          if C:
              lines.append(f'\U0001f534 Critical ({len(C)}):')
              for f in C[:3]: lines.append(f'• {f[:80]}')
              if len(C) > 3: lines.append(f'  ...+{len(C)-3} more')
              lines.append('')
          if H:
              lines.append(f'\U0001f7e0 High ({len(H)}):')
              for f in H[:5]: lines.append(f'• {f[:80]}')
              if len(H) > 5: lines.append(f'  ...+{len(H)-5} more')
              lines.append('')
          parts = []
          if M: parts.append(f'\U0001f7e1 Medium: {M}')
          if L: parts.append(f'\U0001f7e2 Low: {L}')
          if parts: lines += ['   '.join(parts), '']
          lines.append('⚡ Bug Fix pornit (Opus)')
          print('\n'.join(lines))
          PYEOF
          MSG=$(COMMENT="$COMMENT" BRANCH="$BRANCH" PR_NUM="${PR_NUM:-N/A}" python3 /tmp/parse_bugscan.py)
          curl -G -s "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${CALLMEBOT_PHONE}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "apikey=${CALLMEBOT_APIKEY}" || true
