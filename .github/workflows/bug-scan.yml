name: Bug Scan

# Analiză completă de bug-uri (securitate web/mobile, logică, integritate date).
# anthropics/claude-code-action NU suportă evenimentul `push` — de aceea folosim
# `pull_request` (declanșat de fiecare push pe branch-ul unui PR, prin `synchronize`)
# plus `workflow_dispatch` pentru rulare manuală din UI.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Push-uri rapide pe același branch de PR se anulează reciproc — o singură rulare.
concurrency:
  group: bug-scan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  bug-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout (cu istoric)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude bug-hunt
        uses: anthropics/claude-code-action@v1
        with:
          # Token OAuth dintr-un abonament Claude (claude setup-token).
          # Alternativ: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repo: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Branch: ${{ github.ref_name }}

            Fă o analiză completă de bug-uri pe schimbările relevante.

            1. Determină fișierele schimbate, în funcție de eveniment:
               - pull_request: `git diff --name-only origin/${{ github.base_ref }}...HEAD`
               - workflow_dispatch: `git diff --name-only origin/main...HEAD`
                 (dacă e gol sau ești pe main, folosește `git diff --name-only HEAD~1 HEAD`)
               Dacă diff-ul e gol, nu posta nimic și oprește-te.
            2. Invocă skill-ul `strawboss-bug-hunt` pentru analiza multi-unghi completă —
               securitate web/backend, securitate mobilă, bug-uri de logică, integritate
               date, calitate cod. Skill-ul dispecerizează agenții de review specializați.
            3. Scrie raportul consolidat într-un fișier și publică-l:
               - pull_request: comentariu pe PR —
                 `gh pr comment ${{ github.event.pull_request.number }} --body-file <raport.md>`
               - workflow_dispatch: dacă există cel puțin un finding, creează un issue —
                 `gh issue create --label bug-scan --title "Bug scan: ${{ github.ref_name }} <short-sha>" --body-file <raport.md>`
                 Dacă nu sunt findings, nu crea issue — afișează doar "no findings".

            Nu modifica cod. Doar analizează și raportează.
          claude_args: |
            --allowedTools Read,Grep,Glob,Bash,Write,Task
            --max-turns 50

      - name: Notificare WhatsApp — bug-scan
        if: ${{ secrets.CALLMEBOT_PHONE != '' && secrets.CALLMEBOT_APIKEY != '' }}
        env:
          GH_TOKEN:         ${{ github.token }}
          CALLMEBOT_PHONE:  ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PR_NUM:           ${{ github.event.pull_request.number }}
        run: |
          # Extrage linia de findings din ultimul comentariu Claude de pe PR
          FINDINGS_LINE="raport disponibil pe GitHub"
          if [ -n "$PR_NUM" ]; then
            COMMENT=$(gh pr view "$PR_NUM" --json comments \
              --jq '.comments | map(select(.author.login == "claude")) | last | .body' 2>/dev/null || echo "")
            FINDINGS_LINE=$(echo "$COMMENT" | grep -o 'Findings:.*$' | head -1 | sed 's/\*\*//g' || echo "raport disponibil pe GitHub")
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          MSG=$(printf "🔍 Bug Scan — StrawBoss\nPR #${PR_NUM:-N/A} | ${BRANCH}\n\n${FINDINGS_LINE}\n\n⚡ Bug Fix automat pornit (Opus)")
          curl -G -s "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${CALLMEBOT_PHONE}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "apikey=${CALLMEBOT_APIKEY}" || true
