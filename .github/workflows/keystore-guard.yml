name: Keystore Guard

# Fail any push/PR that changes the Android OTA signing keystore. This is the real
# safety net: it cannot be bypassed by `git commit --no-verify` (which only skips the
# local pre-commit hook). Changing the key breaks OTA self-update for every fielded
# Device-Owner phone. See scripts/verify-keystore.sh.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signing keystore fingerprint is unchanged
        run: sh scripts/verify-keystore.sh
