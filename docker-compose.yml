# StrawBoss shared edge: nginx (the reverse proxy for ALL domains on this VM) + certbot.
#
# The StrawBoss APP TIER (backend ×2, admin ×1, redis) runs as a Docker SWARM
# stack — see docker-stack.yml and `./strawboss.sh prod`. nginx reaches those
# Swarm services over the external, attachable overlay `strawboss-net`, and stays
# on the shared `strawboss_default` bridge to reach the other apps on this VM
# (budget, scoala-ai) by container name. Do NOT add backend/admin/redis back here.
#
# NOTE: the running nginx is attached to `strawboss-net` live (docker network
# connect). A `docker compose up -d nginx` will recreate it to match this file —
# a brief blip for all domains — so only do that intentionally.

services:
  nginx:
    image: nginx:alpine
    # infomeditatii.ro — proxy către uvicorn pe host (systemd infomeditatii.service :8000)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - /srv/apps/Service Proof:/srv/apps/Service Proof:ro
      - /srv/apps/StayTravel:/srv/apps/StayTravel:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      - default        # strawboss_default — shared bridge (foreign apps reachable by name)
      - strawboss-net  # Swarm overlay — reach the StrawBoss app-tier service VIPs
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Auto-renew every 12 hours.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    restart: unless-stopped

networks:
  # Created out-of-band by `./strawboss.sh prod` (docker network create --driver
  # overlay --attachable strawboss-net). Declared external so compose attaches
  # nginx to it without trying to manage its lifecycle.
  strawboss-net:
    external: true

volumes:
  letsencrypt:
  certbot-webroot:
