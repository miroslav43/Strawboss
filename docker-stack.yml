# Docker Swarm stack for the StrawBoss app tier (backend ×2, admin ×1, redis ×1).
#
# Deployed by `./strawboss.sh prod` (see scripts/06-docker.sh) via:
#   set -a; source .env; set +a
#   IMAGE_TAG=<git-sha> docker stack deploy -c docker-stack.yml \
#     --resolve-image never strawboss-app
#
# nginx + certbot stay on Docker Compose (docker-compose.yml) as the SHARED
# reverse proxy for the whole VM; they reach these services over the external,
# attachable overlay network `strawboss-net`. Only StrawBoss's own app tier
# lives here — the other sites on the box are untouched.
#
# Swarm-specific notes (differ from Compose):
#  - No `build:`  — Swarm runs prebuilt, tagged images. Build first, then deploy.
#  - No `depends_on:` — Swarm has no start ordering; the backend retries Redis/PG
#    on boot, so order does not matter.
#  - Bind mounts use ABSOLUTE host paths (relative paths are unreliable in stacks).
#  - `container_name`/`restart` are ignored by Swarm — use `deploy.*` instead.
#  - Secrets + IMAGE_TAG are interpolated from the deploy-time shell env.
#  - Service names are deliberately `strawboss-*` (NOT `backend`/`admin`) so the
#    multi-homed nginx never resolves an ambiguous name during the old/new overlap.

services:
  strawboss-backend:
    image: strawboss-backend:${IMAGE_TAG:-latest}
    environment:
      - PORT=3001
      - LOG_ROOT=/app/logs
      - UPLOADS_ROOT=/app/uploads
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      # Email via Resend (outbound_messages / ResendMessagingService). Sourced from
      # .env at deploy time (set -a; source .env). Without these, transport-confirmation
      # emails are marked `failed` ("RESEND not configured") in /messages.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
      # Optional raster logo URL for the confirmation email header (see .env.example).
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL}
      # FCM sender credential for OTA-accel + presence dead-man wake pushes. The
      # service-account JSON is bind-mounted read-only below (never baked into the
      # image / committed). Path is the in-container mount point.
      - FIREBASE_SERVICE_ACCOUNT_FILE=/app/firebase-sa.json
      # Master kill-switch for per-org feature toggles. 'false' makes every org
      # resolve to zero disabled features (i.e. everything enabled) without a
      # rebuild — the pre-feature behaviour. Declared HERE on purpose: the other
      # STRAWBOSS_* switches in this repo are read straight from process.env and
      # appear in no stack file, so a `docker service update --env-add` sets them
      # and the next `docker stack deploy` silently reverts it. The backend logs
      # the resolved value once at boot (search logs/web/ for "feature flags").
      - STRAWBOSS_ORG_FEATURE_FLAGS_ENABLED=${STRAWBOSS_ORG_FEATURE_FLAGS_ENABLED:-true}
    volumes:
      - /srv/apps/Strawboss/logs:/app/logs
      - /srv/apps/Strawboss/uploads:/app/uploads
      - /srv/apps/Strawboss/strawboss-e8de9-firebase-adminsdk-fbsvc-825c42790e.json:/app/firebase-sa.json:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      # 40s margin for cold starts under deploy/reboot contention (the backend
      # normally binds in a few seconds; a success during start_period marks it
      # healthy immediately, so the extra margin costs nothing in the happy path).
      start_period: 40s
    stop_grace_period: 30s
    networks:
      - strawboss-net
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        monitor: 30s
        failure_action: rollback
        max_failure_ratio: 0
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 1G

  strawboss-admin:
    image: strawboss-admin:${IMAGE_TAG:-latest}
    environment:
      # Next.js standalone binds process.env.HOSTNAME (Docker defaults it to the
      # container id → listens on the container IP only). Force 0.0.0.0 so the
      # in-container localhost healthcheck below AND nginx-over-overlay both work.
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://nortiauno.com}
      - BACKEND_URL=http://strawboss-backend:3001
      - LOG_ROOT=/app/logs
    volumes:
      - /srv/apps/Strawboss/logs:/app/logs
    healthcheck:
      # 127.0.0.1 (not localhost): the admin image's busybox wget can resolve
      # `localhost` to ::1 (IPv6) first, but Next binds IPv4 0.0.0.0 only → a
      # localhost check can spuriously get "connection refused". Pin to IPv4.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 6
      # 40s margin for cold starts under contention. The slow-bind root cause is
      # fixed in next.config.ts (experimental.preloadEntriesOnStart: false), so
      # the server now binds in ~1s; a success during start_period flips it
      # healthy immediately, so this margin costs nothing in the happy path.
      start_period: 40s
    stop_grace_period: 15s
    networks:
      - strawboss-net
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        monitor: 30s
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-changeme}']
    volumes:
      - redis-data:/data
    networks:
      - strawboss-net
    stop_grace_period: 10s
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: any

networks:
  strawboss-net:
    external: true

volumes:
  redis-data:
